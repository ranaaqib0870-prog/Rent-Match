<!doctype html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#126b4b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="RENT MATCH">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="apple-touch-icon" href="/icon.svg">
  <meta name="description" content="RENT MATCH پر گھر اور دکانیں آسانی سے تلاش کریں یا اپنی پراپرٹی کرائے پر دینے کے لیے مفت اشتہار لگائیں۔">
  <meta property="og:title" content="RENT MATCH — گھر اور دکان کرائے پر">
  <meta property="og:description" content="صحیح پراپرٹی، صحیح کرایہ دار — آسانی سے">
  <meta property="og:type" content="website">
  <title>RENT MATCH — گھر اور دکان کرائے پر</title>
</head>
<body>
  <div id="app"><div id="bootStatus" style="max-width:520px;margin:12vh auto;padding:24px;border-radius:16px;background:#fff;border:1px solid #ddd;font-family:Arial,sans-serif;text-align:center;color:#222"><h2 style="color:#126b4b">RENT MATCH</h2><p id="bootMessage">ایپ شروع ہو رہی ہے… براہِ کرم چند لمحے انتظار کریں۔</p><button onclick="location.reload()" style="padding:10px 18px;border:0;border-radius:8px;background:#126b4b;color:white">دوبارہ کھولیں</button></div></div>
  <script>
    (function () {
      var timer = setTimeout(function () {
        var box = document.getElementById('bootMessage');
        if (box && document.getElementById('bootStatus')) {
          box.textContent = 'ایپ کا JavaScript شروع نہیں ہو سکا۔ صفحہ دوبارہ کھولیں؛ اگر مسئلہ رہے تو اس پیغام کا اسکرین شاٹ بھیجیں۔';
        }
      }, 10000);
      window.addEventListener('error', function (event) {
        var box = document.getElementById('bootMessage');
        if (box) box.textContent = 'JavaScript Error: ' + (event.message || 'Script load failed');
      });
      window.addEventListener('unhandledrejection', function (event) {
        var box = document.getElementById('bootMessage');
        if (box) box.textContent = 'Startup Error: ' + String(event.reason && event.reason.message || event.reason || 'Unknown error');
      });
      window.__rentMatchBootTimer = timer;
    })();
  </script>
  <script type="module" src="/main.js"></script>
</body>
</html>
